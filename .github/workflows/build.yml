name: Build and verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SprintPilot.sln -c Release
      - run: dotnet run --project tests/SprintPilot.UnitTests -c Release --no-build
      - run: dotnet run --project tests/SprintPilot.IntegrationTests -c Release --no-build
      - run: dotnet publish src/SprintPilot.Web -c Release --no-self-contained -o artifacts/publish
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
